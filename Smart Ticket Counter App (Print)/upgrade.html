<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bus Station</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #141e30, #243b55);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    width: 400px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    color: #243b55;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 6px;
    background: #243b55;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #141e30;
    transform: scale(1.05);
}

.ticket {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border: 2px dashed #243b55;
    border-radius: 10px;
    background: #f4f6f9;
    animation: printEffect 0.8s ease-in-out;
}

@keyframes printEffect {
    from { transform: scaleY(0); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
}

.print-btn {
    background: #28a745;
}

.print-btn:hover {
    background: #1e7e34;
}

</style>
</head>

<body>

<div class="container">
    <h1>🚌 Bus Ticket System</h1>

    <form id="ticketForm">
        <input type="text" id="name" placeholder="Passenger Name" required>
        <input type="number" id="age" placeholder="Age" required>

        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <select id="destination" required>
            <option value="">Select Destination</option>
            <option value="500">Lahore - Rs 500</option>
            <option value="700">Islamabad - Rs 700</option>
            <option value="600">Faisalabad - Rs 600</option>
            <option value="800">Karachi - Rs 800</option>
        </select>

        <button type="submit">Generate Ticket</button>
    </form>

    <div class="ticket" id="ticketCard">
        <h3>🎫 Bus Ticket</h3>
        <p id="ticketDetails"></p>
        <button class="print-btn" onclick="window.print()">Print Ticket</button>
    </div>

</div>

<script>

document.getElementById("ticketForm").addEventListener("submit", function(e){
    e.preventDefault();

    let name = document.getElementById("name").value;
    let age = Number(document.getElementById("age").value);
    let gender = document.getElementById("gender").value;
    let destinationSelect = document.getElementById("destination");
    let basePrice = Number(destinationSelect.value);
    let destinationText = destinationSelect.options[destinationSelect.selectedIndex].text;

    let finalPrice = basePrice;
    let discountMessage = "Full Ticket";

    // Age based discount logic
    if(age <= 5 && age > 0){
        finalPrice = 0;
        discountMessage = "Free Ride";
    }
    else if(age > 5 && age <= 8){
        finalPrice = basePrice * 0.5;
        discountMessage = "50% Discount";
    }
    else if(age > 65){
        finalPrice = basePrice * 0.7;
        discountMessage = "30% Senior Discount";
    }

    // Female special discount
    if(gender === "Female" && age >= 9){
        finalPrice = basePrice * 0.5;
        discountMessage = "50% Special Discount (Female)";
    }

    let ticketInfo = `
        Name: ${name} <br>
        Age: ${age} <br>
        Gender: ${gender} <br>
        Destination: ${destinationText} <br>
        Status: ${discountMessage} <br>
        Final Price: Rs ${finalPrice}
    `;

    document.getElementById("ticketDetails").innerHTML = ticketInfo;
    document.getElementById("ticketCard").style.display = "block";
});

</script>

</body>
</html>
